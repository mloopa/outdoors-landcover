[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outdoors-landcover"
version = "0.1.0"
description = "Global OSM landcover ingestion pipeline for the Outdoors map"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "outdoors contributors" }]
dependencies = [
    "geopandas>=0.14",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "eval-type-backport>=0.2",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
osmium = [
    "pyosmium>=3.7",
]

[project.scripts]
outdoors-landcover = "outdoors_landcover.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/outdoors_landcover"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "outdoors_landcover/config_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/outdoors_landcover/cli.py" = ["UP045"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
