# Country / ISO-3166-1 alpha-2 → Geofabrik extract path(s).
# Multiple extracts are used where Geofabrik splits a country across regions.
version: 1
provider: geofabrik
base_url: https://download.geofabrik.de

# Global mode processes these top-level continental/regional extracts.
# Using continents avoids downloading every country twice and reduces
# boundary duplication vs overlapping country extracts.
global_partitions:
  - africa
  - antarctica
  - asia
  - australia-oceania
  - central-america
  - europe
  - north-america
  - south-america

countries:
  AD: { name: Andorra, extracts: [europe/andorra] }
  AE: { name: United Arab Emirates, extracts: [asia/gcc-states] }
  AF: { name: Afghanistan, extracts: [asia/afghanistan] }
  AL: { name: Albania, extracts: [europe/albania] }
  AM: { name: Armenia, extracts: [asia/armenia] }
  AO: { name: Angola, extracts: [africa/angola] }
  AR: { name: Argentina, extracts: [south-america/argentina] }
  AT: { name: Austria, extracts: [europe/austria] }
