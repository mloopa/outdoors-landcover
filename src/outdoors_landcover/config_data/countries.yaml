  AZ: { name: Azerbaijan, extracts: [asia/azerbaijan] }
  BA: { name: Bosnia and Herzegovina, extracts: [europe/bosnia-herzegovina] }
  BD: { name: Bangladesh, extracts: [asia/bangladesh] }
  BE: { name: Belgium, extracts: [europe/belgium] }
  BG: { name: Bulgaria, extracts: [europe/bulgaria] }
  BO: { name: Bolivia, extracts: [south-america/bolivia] }
  BR: { name: Brazil, extracts: [south-america/brazil] }
  BY: { name: Belarus, extracts: [europe/belarus] }
