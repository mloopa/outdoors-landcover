# Copernicus Land Monitoring Service (CLMS) High Resolution Layers.
# Not CORINE/CLC — pan-European HRL Vegetated Land Cover Characteristics at 10 m.
version: 1
enabled: true
native_resolution_m: 10
year: 2021
# Resample before polygonize (still finer than OSM z0–9 / z8–11 generalisation).
polygonize_resolution_m: 20
attribution: "© European Union, Copernicus Land Monitoring Service"
licence: "Copernicus Land Monitoring Service (free use with attribution)"
catalogue_url: https://catalogue.dataspace.copernicus.eu/odata/v1
token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
download_url: https://download.dataspace.copernicus.eu/odata/v1

# CLMS HRL is pan-European (EEA38 + UK). Used when extract paths are under europe/.
europe_bbox: [-24.6, 34.5, 45.0, 71.6]

layers:
  woodland:
    outdoors_class: woodland
    dataset_identifier: clms_vlcc_forest-type_europe_10m_3yearly_v1
    nodata: [0, 254, 255]
    classes:
      1: { forest_type: non_coniferous }
      2: { forest_type: coniferous }

  grass:
    outdoors_class: grass
    dataset_identifier: clms_vlcc_grassland_europe_10m_yearly_v1
    nodata: [0, 254, 255]
    classes:
      1: { landcover: grass }

  crop:
    outdoors_class: crop
    dataset_identifier: clms_vlcc_crop-types_europe_10m_yearly_v1
    nodata: [0, 254, 255, 65535]
    # Any other CTY code (wheat, maize, grapes, olives, …) → crop at low zoom.
    default_attrs: { landcover: crop }

